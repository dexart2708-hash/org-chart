<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Сеть отелей Номера — Оргструктура</title>

  <script>
    (function() {
      try {
        const saved = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', saved || (prefersDark ? 'dark' : 'light'));
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #f8fafc; --bg-2: #e2e8f0;
      --surface: rgba(255,255,255,0.95); --surface-solid: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #cbd5e1; --border-strong: #94a3b8;
      --text: #0f172a; --text-muted: #475569;
      --accent: #2563eb; --accent-soft: #eff6ff;
      --line-color: #94a3b8;
      --btn-1: #1e293b; --btn-2: #0f172a;
      
      --shadow-sm: 0 1px 3px rgba(15,23,42,0.1);
      --shadow-md: 0 4px 6px -1px rgba(15,23,42,0.1);
      --shadow-lg: 0 10px 15px -3px rgba(15,23,42,0.15);
      
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --transition: 0.2s ease;
    }

    [data-theme="dark"] {
      --bg-1: #0f172a; --bg-2: #1e293b;
      --surface: rgba(30,41,59,0.95); --surface-solid: #1e293b;
      --surface-alt: #334155;
      --border: #334155; --border-strong: #475569;
      --text: #f8fafc; --text-muted: #94a3b8;
      --accent: #3b82f6; --accent-soft: rgba(59,130,246,0.15);
      --line-color: #475569;
      --btn-1: #334155; --btn-2: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      font-family: var(--font); color: var(--text);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5; height: 100vh; overflow: hidden;
      background: var(--bg-1);
    }

    /* Шапка с логотипом */
    .header {
      position: absolute; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }
    
    .logo-area { display: flex; align-items: center; gap: 12px; }
    
    /* ✅ Стили для вашей картинки-логотипа */
    .logo-icon {
      width: 48px; 
      height: 48px;
      object-fit: contain; /* Логотип не будет искажаться */
      /* Если у логотипа нет прозрачного фона и вам нужны скругленные углы, раскомментируйте: */
      /* border-radius: 8px; */ 
    }
    
    .title { font-size: 1.25rem; font-weight: 800; color: var(--text); line-height: 1.1; letter-spacing: -0.02em; }
    .subtitle { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;}
    
    .controls { display: flex; gap: 12px; }
    .btn {
      font-family: var(--font); font-size: 0.875rem; font-weight: 600;
      padding: 8px 16px; border-radius: 8px; cursor: pointer;
      background: linear-gradient(180deg, var(--btn-1), var(--btn-2));
      color: #fff; border: 1px solid transparent;
      display: flex; align-items: center; gap: 6px;
      transition: all var(--transition);
    }
    .btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .btn.secondary { background: var(--surface-solid); color: var(--text); border-color: var(--border); }
    .btn.secondary:hover { background: var(--surface-alt); }

    /* Бесконечный холст */
    .canvas-container {
      position: absolute; inset: 0;
      top: 73px; /* Высота шапки чуть увеличилась из-за размера лого */
      overflow: auto;
      background-image: radial-gradient(var(--border) 1px, transparent 1px);
      background-size: 20px 20px;
    }
    .canvas {
      position: relative;
      width: 5000px; /* Огромный холст */
      height: 5000px;
      min-width: 100%; min-height: 100%;
    }
    #lines {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 1;
    }

    /* Карточка должности */
    .org-card {
      position: absolute;
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 200px;
      max-width: 280px;
      box-shadow: var(--shadow-sm);
      transition: box-shadow var(--transition), border-color var(--transition);
      z-index: 2;
      cursor: grab;
      touch-action: none;
      user-select: none;
    }
    .org-card:active { cursor: grabbing; }
    .org-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }
    .org-card.dragging {
      box-shadow: var(--shadow-lg);
      border-color: var(--accent);
      z-index: 100;
      cursor: grabbing;
      opacity: 0.9;
    }
    
    /* Стили для текста в карточке */
    .org-role { font-weight: 700; font-size: 0.875rem; color: var(--text); line-height: 1.2; margin-bottom: 4px; text-align: center; }
    .org-name { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 2px; text-align: center; }
    .org-dept { font-size: 0.6875rem; font-weight: 600; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 4px; margin-top: 6px; }
    
    /* Блок "По каким вопросам" */
    .org-issues {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
      text-align: center;
      border-top: 1px dashed var(--border);
      padding-top: 8px;
      width: 100%;
      line-height: 1.3;
      word-break: break-word;
    }
    .org-issues strong {
      color: var(--text);
      font-weight: 600;
      display: block;
      margin-bottom: 2px;
    }

    /* Кнопки действий на карточке */
    .org-actions {
      position: absolute; top: -12px; right: -12px;
      display: flex; gap: 4px;
      opacity: 0; transition: opacity var(--transition);
      background: var(--surface-solid);
      padding: 4px; border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      z-index: 5;
    }
    .org-card:hover .org-actions { opacity: 1; }
    .org-actions button {
      width: 24px; height: 24px; padding: 0; border: none; border-radius: 4px;
      background: transparent; color: var(--text-muted); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.75rem; transition: all var(--transition);
    }
    .org-actions button:hover { background: var(--surface-alt); color: var(--text); }
    .org-actions button.add-btn:hover { color: #059669; background: #ecfdf5; }
    .org-actions button.delete-btn:hover { color: #dc2626; background: #fef2f2; }

    /* Стили для пустого состояния */
    .empty-state {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      text-align: center; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      pointer-events: none; z-index: 0;
    }
    .empty-state h2 { color: var(--text); font-size: 1.5rem; }

    /* Модальное окно */
    .modal-overlay {
      position: fixed; inset: 0; z-index: 1000;
      background: rgba(15,23,42,0.6); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-overlay.visible { display: flex; }
    .modal {
      background: var(--surface-solid); border-radius: 16px;
      padding: 24px; width: 100%; max-width: 440px;
      box-shadow: var(--shadow-lg); border: 1px solid var(--border);
      animation: modalIn 0.3s ease;
      max-height: 90vh; overflow-y: auto;
    }
    @keyframes modalIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .modal-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 20px; }
    
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; }
    
    input, textarea {
      font-family: var(--font); font-size: 0.9375rem; padding: 10px 12px;
      color: var(--text); background: var(--surface);
      border: 1px solid var(--border-strong); border-radius: 8px; outline: none;
      transition: border-color var(--transition);
    }
    textarea {
      resize: vertical;
      min-height: 70px;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    
    .modal-footer { display: flex; gap: 10px; margin-top: 24px; }
    .modal-footer button { flex: 1; justify-content: center; padding: 12px; }

    @media (max-width: 720px) {
      .header { padding: 10px 16px; flex-direction: column; align-items: stretch; gap: 10px; }
      .logo-area { justify-content: center; }
      .controls { justify-content: space-between; }
      .canvas-container { top: 110px; }
      .org-card { min-width: 160px; padding: 10px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-area">
      <!-- ✅ Здесь мы заменили эмодзи на картинку. Убедитесь, что файл logo.png лежит в репозитории -->
      <img src="logo.png" alt="Сеть отелей Номера" class="logo-icon" onerror="this.style.display='none'">
      <div>
        <div class="title">Сеть отелей Номера</div>
        <div class="subtitle">Оргструктура компании</div>
      </div>
    </div>
    <div class="controls">
      <button class="btn secondary" id="resetViewBtn" title="Вернуть вид в центр">🎯 Центр</button>
      <button class="btn secondary" id="themeToggle">🌙 Тема</button>
      <button class="btn" id="addRootBtn">➕ Добавить верхушку</button>
    </div>
  </div>

  <!-- Холст для перетаскивания -->
  <div class="canvas-container" id="canvasContainer">
    <div class="canvas" id="canvas">
      <svg id="lines"></svg>
      <!-- Карточки будут добавляться сюда -->
    </div>
  </div>

  <!-- Модальное окно -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-title" id="modalTitle">Добавить должность</div>
      <form id="nodeForm">
        <input type="hidden" id="nodeId">
        <input type="hidden" id="parentId">
        
        <div class="field">
          <label>Название должности *</label>
          <input type="text" id="role" placeholder="Например: Генеральный директор" required>
        </div>
        <div class="field">
          <label>ФИО сотрудника</label>
          <input type="text" id="name" placeholder="Например: Иванов Иван">
        </div>
        <div class="field">
          <label>Отдел / Департамент</label>
          <input type="text" id="dept" placeholder="Например: Администрация">
        </div>
        <div class="field">
          <label>По каким вопросам обращаться</label>
          <textarea id="issues" placeholder="Например: Бронирование, VIP-клиенты, Жалобы..."></textarea>
        </div>
        
        <div class="modal-footer">
          <button type="button" class="btn secondary" id="cancelBtn">Отмена</button>
          <button type="submit" class="btn" id="submitBtn">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import {
      initializeFirestore,
      persistentLocalCache,
      persistentMultipleTabManager,
      collection,
      doc,
      addDoc,
      updateDoc,
      deleteDoc,
      query,
      onSnapshot,
      serverTimestamp
    } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDdm0kaIesCu4CBennxPVoPhXwyAyAiwIg",
      authDomain: "chek-listdb.firebaseapp.com",
      projectId: "chek-listdb",
      storageBucket: "chek-listdb.firebasestorage.app",
      messagingSenderId: "966580226421",
      appId: "1:966580226421:web:af59fd2a1ad92fd4b8eb3c"
    };

    const app = initializeApp(firebaseConfig);
    const db = initializeFirestore(app, {
      localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    });

    const COLLECTION = 'org_structure';
    let allNodes = [];
    let unsubscribe = null;

    // Тема
    document.getElementById('themeToggle').addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    // Центрирование
    document.getElementById('resetViewBtn').addEventListener('click', () => {
      const container = document.getElementById('canvasContainer');
      container.scrollTo({ top: 0, left: 0, behavior: 'smooth' });
    });

    // Загрузка данных
    function subscribeToData() {
      if (unsubscribe) unsubscribe();
      const q = query(collection(db, COLLECTION));
      unsubscribe = onSnapshot(q, snapshot => {
        allNodes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        renderTree();
      }, err => {
        console.error('Ошибка загрузки:', err);
        alert('Не удалось загрузить данные.');
      });
    }

    // Отрисовка карточек и линий
    function renderTree() {
      const canvas = document.getElementById('canvas');
      const emptyState = document.querySelector('.empty-state');

      Array.from(canvas.children).forEach(child => {
        if (child.tagName !== 'svg') child.remove();
      });

      if (allNodes.length === 0) {
        if (!emptyState) {
          const div = document.createElement('div');
          div.className = 'empty-state';
          div.innerHTML = `
            <h2>Схема пуста</h2>
            <p>Нажмите «Добавить верхушку», чтобы создать первую должность.</p>
          `;
          canvas.appendChild(div);
        }
        document.getElementById('lines').innerHTML = '';
        return;
      }

      if (emptyState) emptyState.remove();

      allNodes.forEach(node => {
        const el = document.createElement('div');
        el.className = 'org-card';
        el.id = `node-${node.id}`;
        
        let x = node.x !== undefined ? node.x : 100;
        let y = node.y !== undefined ? node.y : 100;
        
        el.style.left = `${x}px`;
        el.style.top = `${y}px`;

        const issuesHtml = node.issues ? `
          <div class="org-issues">
            <strong>💬 Вопросы:</strong>
            ${esc(node.issues)}
          </div>
        ` : '';

        el.innerHTML = `
          <div class="org-actions">
            <button class="add-btn" onclick="openModal(null, '${node.id}')" title="Добавить подчиненного">➕</button>
            <button onclick="openModal('${node.id}')" title="Редактировать">✏️</button>
            <button class="delete-btn" onclick="deleteNode('${node.id}')" title="Удалить">🗑️</button>
          </div>
          <div class="org-role">${esc(node.role)}</div>
          ${node.name ? `<div class="org-name">${esc(node.name)}</div>` : ''}
          ${node.dept ? `<div class="org-dept">${esc(node.dept)}</div>` : ''}
          ${issuesHtml}
        `;

        makeDraggable(el, node);
        canvas.appendChild(el);
      });

      setTimeout(drawLines, 50);
    }

    // Отрисовка SVG линий
    function drawLines() {
      const svg = document.getElementById('lines');
      svg.innerHTML = '';
      const canvasRect = document.getElementById('canvas').getBoundingClientRect();

      allNodes.forEach(node => {
        if (!node.parentId) return;
        const parent = allNodes.find(n => n.id === node.parentId);
        if (!parent) return;

        const pEl = document.getElementById(`node-${parent.id}`);
        const cEl = document.getElementById(`node-${node.id}`);
        if (!pEl || !cEl) return;

        const pRect = pEl.getBoundingClientRect();
        const cRect = cEl.getBoundingClientRect();

        const px = pRect.left - canvasRect.left + pRect.width / 2;
        const py = pRect.top - canvasRect.top + pRect.height / 2;
        const cx = cRect.left - canvasRect.left + cRect.width / 2;
        const cy = cRect.top - canvasRect.top + cRect.height / 2;

        const diffX = Math.abs(px - cx);
        const diffY = Math.abs(py - cy);

        let pathD = '';

        if (diffY > diffX) {
          const startY = py < cy ? pRect.bottom - canvasRect.top : pRect.top - canvasRect.top;
          const endY = py < cy ? cRect.top - canvasRect.top : cRect.bottom - canvasRect.top;
          const midY = startY + (endY - startY) / 2;
          pathD = `M ${px} ${startY} V ${midY} H ${cx} V ${endY}`;
        } else {
          const startX = px < cx ? pRect.right - canvasRect.left : pRect.left - canvasRect.left;
          const endX = px < cx ? cRect.left - canvasRect.left : cRect.right - canvasRect.left;
          const midX = startX + (endX - startX) / 2;
          pathD = `M ${startX} ${py} H ${midX} V ${cy} H ${endX}`;
        }

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', pathD);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', 'var(--line-color)');
        path.setAttribute('stroke-width', '2');
        path.setAttribute('stroke-linejoin', 'round');
        svg.appendChild(path);
      });
    }

    // Логика перетаскивания
    function makeDraggable(el, node) {
      let isDragging = false;
      let startX, startY;
      let initialX = node.x || 0;
      let initialY = node.y || 0;

      el.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.org-actions')) return;
        
        e.preventDefault();
        isDragging = true;
        el.classList.add('dragging');
        el.setPointerCapture(e.pointerId);

        startX = e.clientX;
        startY = e.clientY;
        initialX = node.x || 0;
        initialY = node.y || 0;
      });

      el.addEventListener('pointermove', (e) => {
        if (!isDragging) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;

        const newX = initialX + dx;
        const newY = initialY + dy;

        el.style.left = `${newX}px`;
        el.style.top = `${newY}px`;

        node.x = newX;
        node.y = newY;
        
        drawLines();
      });

      el.addEventListener('pointerup', async (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');
        el.releasePointerCapture(e.pointerId);

        try {
          await updateDoc(doc(db, COLLECTION, node.id), {
            x: node.x,
            y: node.y
          });
        } catch (err) {
          console.error('Ошибка сохранения координат:', err);
        }
      });
      
      el.addEventListener('pointercancel', (e) => {
        if (!isDragging) return;
        isDragging = false;
        el.classList.remove('dragging');
        el.releasePointerCapture(e.pointerId);
      });
    }

    function esc(s) {
      return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/\n/g, '<br>');
    }

    // --- Модальное окно ---
    const modal = document.getElementById('modalOverlay');
    const form = document.getElementById('nodeForm');

    window.openModal = (editId = null, parentId = null) => {
      form.reset();
      document.getElementById('nodeId').value = editId || '';
      document.getElementById('parentId').value = parentId || '';

      if (editId) {
        const node = allNodes.find(n => n.id === editId);
        if (node) {
          document.getElementById('modalTitle').textContent = 'Редактировать должность';
          document.getElementById('role').value = node.role || '';
          document.getElementById('name').value = node.name || '';
          document.getElementById('dept').value = node.dept || '';
          document.getElementById('issues').value = node.issues || '';
        }
      } else {
        document.getElementById('modalTitle').textContent = parentId ? 'Добавить подчиненного' : 'Добавить верхушку';
      }
      
      modal.classList.add('visible');
      document.getElementById('role').focus();
    };

    document.getElementById('addRootBtn').addEventListener('click', () => openModal(null, null));
    document.getElementById('cancelBtn').addEventListener('click', () => modal.classList.remove('visible'));
    
    modal.addEventListener('mousedown', (e) => {
      if (e.target === modal) modal.classList.remove('visible');
    });

    // Сохранение
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const editId = document.getElementById('nodeId').value;
      const parentId = document.getElementById('parentId').value;
      
      const data = {
        role: document.getElementById('role').value.trim(),
        name: document.getElementById('name').value.trim(),
        dept: document.getElementById('dept').value.trim(),
        issues: document.getElementById('issues').value.trim(),
        parentId: parentId || null
      };

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      try {
        if (editId) {
          await updateDoc(doc(db, COLLECTION, editId), data);
        } else {
          if (parentId) {
            const parent = allNodes.find(n => n.id === parentId);
            if (parent) {
              data.x = (parent.x || 100) + (Math.random() * 60 - 30); 
              data.y = (parent.y || 100) + 160; 
            } else {
              data.x = 300; data.y = 100;
            }
          } else {
            data.x = 300; data.y = 100;
          }
          
          data.createdAt = serverTimestamp();
          await addDoc(collection(db, COLLECTION), data);
        }
        modal.classList.remove('visible');
      } catch (err) {
        console.error('Ошибка сохранения:', err);
        alert('Ошибка: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Сохранить';
      }
    });

    // Удаление (с каскадом)
    window.deleteNode = async (id) => {
      const node = allNodes.find(n => n.id === id);
      if (!node) return;

      const getDescendants = (parentId) => {
        let descendants = [];
        const children = allNodes.filter(n => n.parentId === parentId);
        children.forEach(child => {
          descendants.push(child.id);
          descendants = descendants.concat(getDescendants(child.id));
        });
        return descendants;
      };

      const descendants = getDescendants(id);
      const count = descendants.length;

      const confirmText = count > 0 
        ? `Удалить должность "${node.role}" и всех её подчиненных (${count} чел.)?`
        : `Удалить должность "${node.role}"?`;

      if (!confirm(confirmText)) return;

      try {
        const idsToDelete = [id, ...descendants];
        const promises = idsToDelete.map(nodeId => deleteDoc(doc(db, COLLECTION, nodeId)));
        await Promise.all(promises);
      } catch (err) {
        console.error('Ошибка удаления:', err);
        alert('Не удалось удалить: ' + err.message);
      }
    };

    window.addEventListener('resize', drawLines);
    subscribeToData();
  </script>
</body>
</html>
